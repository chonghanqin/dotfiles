# version: 1.0.0
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false
continuation_prompt = "[> ](dimmed white)"

format = """($nix_shell$container$fill$git_metrics\n)$cmd_duration\
$hostname\
$localip\
$shlvl\
$shell\
$env_var\
$jobs\
$sudo\
$username\
$conda\
$character"""

right_format = """
$singularity\
$kubernetes\
$directory\
$vcsh\
$fossil_branch\
$git_branch\
$git_commit\
$git_state\
$git_status\
$hg_branch\
$pijul_channel\
$docker_context\
$package\
$c\
$cpp\
$cmake\
$cobol\
$daml\
$dart\
$deno\
$dotnet\
$elixir\
$elm\
$erlang\
$fennel\
$fortran\
$golang\
$guix_shell\
$haskell\
$haxe\
$helm\
$java\
$julia\
$kotlin\
$gradle\
$lua\
$maven\
$nim\
$nodejs\
$bun\
$ocaml\
$opa\
$perl\
$php\
$pulumi\
$purescript\
$python\
$raku\
$rlang\
$red\
$ruby\
$rust\
$scala\
$solidity\
$swift\
$terraform\
$vlang\
$vagrant\
$xmake\
$zig\
$buf\
$pixi\
$meson\
$spack\
$memory_usage\
$aws\
$gcloud\
$openstack\
$azure\
$crystal\
$custom\
$status\
$os\
$battery\
$time"""

[fill]
symbol = ' '

[character]
disabled = true

[env_var.VIMSHELL]
format = "[$env_value]($style)"
style = 'green italic'

[sudo]
format = "[$symbol]($style)"
style = "bold italic bright-purple"
symbol = "sudo "
disabled = false

[username]
style_user = "bright-yellow bold italic"
style_root = "purple bold italic"
format = "[$user]($style) "
disabled = false
show_always = false

[directory]
home_symbol = "~"
truncation_length = 2
truncation_symbol = ""
read_only = " (ro)"
use_os_path_sep = true
style = "italic blue"
format = '[$path]($style)[$read_only]($read_only_style)'
repo_root_style = 'bold blue'
repo_root_format = '[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style)'

[cmd_duration]
format = "[took $duration ](italic white)"

[jobs]
format = "[$symbol$number]($style) "
style = "white"
symbol = "jobs:"

[hostname]
ssh_symbol = "ssh "

[localip]
ssh_only = true
format = " [$localipv4](bold magenta)"
disabled = false

[time]
disabled = false
format = "[ $time]($style)"
time_format = "%R"
utc_time_offset = "local"
style = "italic dimmed white"

[battery]
format = "[ $percentage $symbol]($style)"
full_symbol = "full"
charging_symbol = "[charging](italic bold green)"
discharging_symbol = "discharging"
unknown_symbol = "unknown"
empty_symbol = "empty"

[[battery.display]]
threshold = 20
style = "italic bold red"

[[battery.display]]
threshold = 60
style = "italic dimmed bright-purple"

[[battery.display]]
threshold = 70
style = "italic dimmed yellow"

[git_branch]
format = " [$branch(:$remote_branch)]($style)"
style = "italic bright-blue"
truncation_symbol = "."
truncation_length = 11
ignore_branches = ["main", "master"]
only_attached = true

[git_metrics]
format = '([+$added]($added_style))([-$deleted]($deleted_style))'
added_style = 'italic dimmed green'
deleted_style = 'italic dimmed red'
ignore_submodules = true
disabled = false

[git_status]
style = "bold italic bright-blue"
format = '( [\[git$ahead_behind$staged$modified$untracked$renamed$deleted$conflicted$stashed\]]($style))'
conflicted = "[ conflicted](italic bright-magenta)"
ahead = "[ ahead:$count](italic green)"
behind = "[ behind:$count](italic red)"
diverged = "[ ahead:$ahead_count behind:$behind_count](italic bright-magenta)"
untracked = "[ untracked](italic bright-yellow)"
stashed = "[ stashed](italic white)"
modified = "[ modified](italic yellow)"
staged = "[ staged:$count](italic bright-cyan)"
renamed = "[ renamed](italic bright-blue)"
deleted = "[ deleted](italic red)"

[deno]
format = " [deno](italic)( [$version](green bold))"
version_format = "${raw}"

[lua]
format = " [lua](italic)( [$version]($style))"
version_format = "${raw}"
style = "bold bright-yellow"

[nodejs]
format = " [node](italic)( [$version](bold bright-green))"
version_format = "${raw}"
detect_files = ["package-lock.json", "yarn.lock"]
detect_folders = ["node_modules"]
detect_extensions = []

[bun]
format = " [bun](italic)( [$version](bold bright-green))"
version_format = "${raw}"

[python]
format = " [py](italic)( [$version]($style))"
version_format = "${raw}"
style = "bold bright-yellow"

[ruby]
format = " [rb](italic)( [$version]($style))"
version_format = "${raw}"
style = "bold red"

[rust]
format = " [rs](italic)( [$version]($style))"
version_format = "${raw}"
style = "bold red"

[package]
format = " [pkg](italic dimmed)( [$version]($style))"
version_format = "${raw}"
style = "dimmed yellow italic bold"

[swift]
format = " [sw](italic)( [$version]($style))"
style = "bold bright-red"
version_format = "${raw}"

[aws]
disabled = true
format = " [aws](italic) [$profile $region]($style)"
style = "bold blue"

[buf]
format = " [buf](italic)( [$version( $buf_version)]($style))"

[c]
symbol = "C "
format = " [$symbol($version(-$name))]($style)"

[cpp]
symbol = "C++ "
format = " [$symbol($version(-$name))]($style)"

[conda]
symbol = ""
format = '[\($environment\)]($style) '
style = "bold yellow"
ignore_base = false

[pixi]
format = " pixi [$version ($environment )]($style)"

[dart]
format = " dart( [$version]($style))"

[docker_context]
format = " docker [$context]($style)"

[elixir]
format = " exs [$version OTP $otp_version ]($style)"

[elm]
format = " elm( [$version]($style))"

[golang]
format = " go( [$version]($style))"

[haskell]
format = " hs( [$version]($style))"

[java]
format = " java( [$version]($style))"

[julia]
format = " jl( [$version]($style))"

[memory_usage]
format = " mem [${ram}( ${swap})]($style)"

[nim]
format = " nim( [$version]($style))"

[nix_shell]
style = 'bold italic dimmed blue'
format = '[nix $state]($style)( [$name](italic dimmed white))'
impure_msg = '[impure](bold dimmed red)'
pure_msg = '[pure](bold dimmed green)'
unknown_msg = '[unknown](bold dimmed yellow)'

[spack]
format = " spack [$environment]($style)"

# Plain text for modules whose default formats use icons.
[azure]
symbol = "azure "

[cmake]
symbol = "cmake "

[cobol]
symbol = "cobol "

[container]
symbol = "container"

[crystal]
symbol = "crystal "

[daml]
symbol = "daml "

[dotnet]
format = 'via [$symbol($version )(target $tfm )]($style)'

[erlang]
symbol = "erl "

[fennel]
symbol = "fennel "

[fortran]
symbol = "fortran "

[fossil_branch]
symbol = "fossil "
truncation_symbol = "..."

[gcloud]
symbol = "gcp "

[git_commit]
tag_symbol = " tag "

[gradle]
symbol = "gradle "

[guix_shell]
symbol = "guix "

[haxe]
symbol = "haxe "

[helm]
symbol = "helm "

[hg_branch]
symbol = "hg "
truncation_symbol = "..."

[kotlin]
symbol = "kotlin "

[kubernetes]
symbol = "k8s "

[maven]
symbol = "maven "

[meson]
symbol = "meson "
truncation_symbol = "..."

[ocaml]
symbol = "ocaml "

[opa]
symbol = "opa "

[openstack]
symbol = "openstack "

[perl]
symbol = "perl "

[php]
symbol = "php "

[pijul_channel]
symbol = "pijul "
truncation_symbol = "..."

[pulumi]
symbol = "pulumi "

[raku]
symbol = "raku "

[red]
symbol = "red "

[rlang]
symbol = "R "

[scala]
symbol = "scala "

[shlvl]
symbol = "shlvl "

[terraform]
symbol = "terraform "

[vagrant]
symbol = "vagrant "

[xmake]
symbol = "xmake "

[zig]
symbol = "zig "
